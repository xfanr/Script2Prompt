<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebDAV authentication UI tests (memory storage)</title>
<div id="app"></div>
<script type="module">
  import { createApp } from 'vue'
  import ElementPlus from 'element-plus'
  import zhCn from 'element-plus/es/locale/lang/zh-cn'
  import 'element-plus/dist/index.css'
  import 'element-plus/theme-chalk/dark/css-vars.css'
  import '../src/styles.css'
  import App from '../src/App.vue'
  import { normalizeGlobalConfig } from '../src/config'
  import { createInitialState } from '../src/defaults'
  import { LocalRepository } from '../src/storage'
  import { MemoryStorage } from './point-ledger.ts'
  import { MockDav } from './storage-webdav.ts'

  const storage = new MemoryStorage()
  const session = new MemoryStorage()
  Object.defineProperty(window, 'localStorage', { value: storage })
  Object.defineProperty(window, 'sessionStorage', { value: session })
  storage.setItem('script2prompt.webdavSettings.v1', JSON.stringify({
    baseUrl: `${location.origin}/dav/scripts/`, username: 'test-user',
    legacyFilename: 'legacy.json', lastSyncedAt: null,
  }))
  const config = normalizeGlobalConfig(await (await fetch('/config/default-config.json')).json())
  const repository = new LocalRepository(storage)
  repository.save(createInitialState(config))
  const dav = new MockDav()
  const attempts = []
  const originalFetch = window.fetch.bind(window)
  window.fetch = async (input, init = {}) => {
    const url = new URL(String(input), location.href)
    if (!url.pathname.startsWith('/dav/scripts/')) return originalFetch(input, init)
    const authorized = new Headers(init.headers).get('Authorization') === `Basic ${btoa('test-user:correct-password')}`
    attempts.push({ method: init.method ?? 'GET', authorized })
    return authorized ? dav.request(url.toString(), init) : new Response(null, { status: 401 })
  }
  let app
  function remount() {
    app?.unmount()
    app = createApp(App, { initialGlobalConfig: config, initialState: repository.load(config), repository })
    app.use(ElementPlus, { locale: zhCn }).mount('#app')
  }
  remount()
  window.webDavAuthTest = { dav, attempts, storage, session, remount }
</script>
</html>
